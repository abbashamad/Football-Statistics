spring.application.name=football-statistics

app.openai.api-key=${OPEN_API_KEY}
app.openai.url=https://api.openai.com/v1/chat/completions
app.openai.model=gpt-5.5
app.openai.max-completion-tokens=500

app.football.api-key=${FOOTBALL_API_KEY}
app.football.url=https://v3.football.api-sports.io

spring.datasource.url=jdbc:mysql://localhost:3306/football_statistics
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
